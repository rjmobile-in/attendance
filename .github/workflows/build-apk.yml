name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android Project
        run: |
          mkdir -p www
          cp index.html www/
          cp logo.png www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "RJ Admin" "com.rjmobile.attendanceadmin" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate App Icon
        run: |
          pip install Pillow --quiet
          echo "" | base64 -d > generate_icons.py
          python3 generate_icons.py || true

      - name: Inject Permissions
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle

      - name: Configure Release Signing
        run: |
          echo "" | base64 -d > android/app/rjmobile.keystore
          echo "" | base64 -d > inject_signing.py
          python3 inject_signing.py

      - name: Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Attendance-Admin-APK
          path: android/app/build/outputs/apk/release/app-release.apk
